name: Win-Maintenance-6H

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'CIDR / IP list (space-separated)'
        required: true
      ports:
        description: 'Port spec'
        required: false
        default: '1-65535'
      rate:
        description: 'masscan pps'
        required: false
        default: '500000'

jobs:
  scan:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Tune network stack for raw-socket injection
        shell: powershell
        run: |
          # --- Kill Defender real-time + firewall (both flag raw scanners) ---
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction SilentlyContinue

          # --- TCP globals: shrink windows, disable RSC/timestamps, DCA on ---
          netsh int tcp set global autotuninglevel=normal          | Out-Null
          netsh int tcp set global chimney=disabled                | Out-Null
          netsh int tcp set global rss=enabled                     | Out-Null
          netsh int tcp set global rsc=disabled                    | Out-Null
          netsh int tcp set global timestamps=disabled             | Out-Null
          netsh int tcp set global initialRto=300                  | Out-Null
          netsh int tcp set global maxsynretransmissions=2         | Out-Null
          netsh int tcp set global nonsackrttresiliency=disabled   | Out-Null
          netsh int tcp set global ecncapability=disabled          | Out-Null
          netsh int tcp set global dca=enabled                     | Out-Null
          netsh int tcp set global netdma=disabled                 | Out-Null
          netsh int tcp set heuristics disabled                    | Out-Null
          netsh int tcp set security mpp=disabled                  | Out-Null
          netsh int tcp set supplemental Internet congestionprovider=CTCP | Out-Null
          netsh int ip  set global taskoffload=disabled            | Out-Null

          # --- Tcpip registry: fast ACK, no Nagle, wide port range ---
          $tcp = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
          Set-ItemProperty $tcp -Name Tcp1323Opts          -Value 1 -Type DWord
          Set-ItemProperty $tcp -Name MaxUserPort          -Value 65534 -Type DWord
          Set-ItemProperty $tcp -Name TcpTimedWaitDelay    -Value 30  -Type DWord
          Set-ItemProperty $tcp -Name TcpAckFrequency      -Value 1   -Type DWord
          Set-ItemProperty $tcp -Name TCPNoDelay           -Value 1   -Type DWord
          Set-ItemProperty $tcp -Name DefaultTTL           -Value 64  -Type DWord
          Set-ItemProperty $tcp -Name EnablePMTUDiscovery  -Value 0   -Type DWord
          Set-ItemProperty $tcp -Name EnableTCPA           -Value 1   -Type DWord
          Set-ItemProperty $tcp -Name SynAttackProtect     -Value 0   -Type DWord

          # --- AFD: bigger transmit queue, more worker threads ---
          $afd = 'HKLM:\SYSTEM\CurrentControlSet\Services\AFD\Parameters'
          if (-not (Test-Path $afd)) { New-Item $afd -Force | Out-Null }
          Set-ItemProperty $afd -Name DefaultReceiveWindow      -Value 1048576 -Type DWord
          Set-ItemProperty $afd -Name DefaultSendWindow         -Value 1048576 -Type DWord
          Set-ItemProperty $afd -Name FastSendDatagramThreshold -Value 65536   -Type DWord
          Set-ItemProperty $afd -Name LargeBufferSize           -Value 65536   -Type DWord
          Set-ItemProperty $afd -Name MaxFastTransmit           -Value 65536   -Type DWord
          Set-ItemProperty $afd -Name TransmitWorker            -Value 32      -Type DWord

          # --- NIC: disable interrupt moderation, max RSS queues ---
          Get-NetAdapter -Physical | ForEach-Object {
            try {
              Set-NetAdapterAdvancedProperty -Name $_.Name -DisplayName 'Interrupt Moderation' -DisplayValue 'Disabled' -ErrorAction SilentlyContinue
              Set-NetAdapterAdvancedProperty -Name $_.Name -DisplayName 'Receive Side Scaling' -DisplayValue 'Enabled' -ErrorAction SilentlyContinue
              Set-NetAdapterAdvancedProperty -Name $_.Name -DisplayName 'Large Send Offload V2 (IPv4)' -DisplayValue 'Disabled' -ErrorAction SilentlyContinue
              Set-NetAdapterAdvancedProperty -Name $_.Name -DisplayName 'Jumbo Packet' -DisplayValue 'Disabled' -ErrorAction SilentlyContinue
            } catch {}
          }

      - name: Install Npcap + masscan + nmap
        shell: powershell
        run: |
          # Npcap in WinPcap-compat mode — masscan links against wpcap.dll
          $npc = "$env:TEMP\npcap.exe"
          Invoke-WebRequest 'https://npcap.com/dist/npcap-1.79.exe' -OutFile $npc -UseBasicParsing
          Start-Process $npc -ArgumentList '/S','/winpcap_mode=yes','/loopback_support=yes' -Wait

          # masscan 1.3.2 win64
          $mc = "$env:TEMP\masscan.zip"
          Invoke-WebRequest 'https://github.com/robertdavidgraham/masscan/releases/download/1.3.2/masscan-1.3.2-win64.zip' -OutFile $mc -UseBasicParsing
          Expand-Archive $mc -DestinationPath 'C:\masscan' -Force

          # nmap (silent)
          $nm = "$env:TEMP\nmap.exe"
          Invoke-WebRequest 'https://nmap.org/dist/nmap-7.95-setup.exe' -OutFile $nm -UseBasicParsing
          Start-Process $nm -ArgumentList '/S' -Wait

          # confirm
          Get-ChildItem C:\masscan
          & 'C:\Program Files (x86)\Nmap\nmap.exe' --version | Select-Object -First 2

      - name: Warm ARP + route to target
        shell: powershell
        env:
          TARGET: ${{ inputs.target }}
        run: |
          # first-hop ARP prime — cuts cold-start retransmits during masscan spin-up
          $first = ($env:TARGET -split '\s+')[0].Split('/')[0]
          for ($i = 0; $i -lt 20; $i++) {
            Test-Connection -Count 1 -Quiet $first -ErrorAction SilentlyContinue | Out-Null
          }
          arp -a | Out-Null
          route print | Out-Null

      - name: masscan — full sweep
        shell: powershell
        env:
          TARGET: ${{ inputs.target }}
          PORTS: ${{ inputs.ports }}
          RATE: ${{ inputs.rate }}
        run: |
          # --adapter-ip 0.0.0.0 binds to first up NIC; Npcap does raw inject
          # --source-port random range spreads across 25k ports to dodge per-flow SYN limits
          C:\masscan\masscan.exe `
            $env:TARGET `
            -p$env:PORTS `
            --rate $env:RATE `
            --wait 3 `
            --retries 1 `
            --max-retries 1 `
            --adapter-ip 0.0.0.0 `
            --source-port 40000-65535 `
            --ttl 64 `
            --randomize-hosts `
            --banners `
            --http-user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" `
            --open-only `
            -oJ scan.json
        continue-on-error: true

      - name: nmap — version + scripts on hits
        shell: powershell
        env:
          TARGET: ${{ inputs.target }}
        run: |
          # masscan gives the port list; nmap does the deep pass
          # -T5 insane, -Pn no host discovery, --defeat-rst-ratelimit defeats rate caps on stateless firewalls
          & 'C:\Program Files (x86)\Nmap\nmap.exe' `
            -Pn -n -T5 `
            --min-rate 100000 `
            --max-retries 1 `
            --defeat-rst-ratelimit `
            --version-light `
            -p- `
            $env:TARGET `
            -oX nmap.xml -oN nmap.txt
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: |
            scan.json
            nmap.xml
            nmap.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Hold session
        shell: powershell
        run: |
          while ($true) { Start-Sleep 60 }
