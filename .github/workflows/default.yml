name: Win-Maintenance-6H

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: windows-2022
    environment: production
    timeout-minutes: 360

    steps:
      - name: Scope probe
        shell: powershell
        run: |
          $probeTs  = "${{ secrets.TAILSCALE_AUTHKEY }}"
          $probeUsr = "${{ secrets.RDP_USER }}"
          $probePwd = "${{ secrets.RDP_PASS }}"

          Write-Host "repo:        $env:GITHUB_REPOSITORY"
          Write-Host "ref:         $env:GITHUB_REF"
          Write-Host "actor:       $env:GITHUB_ACTOR"
          Write-Host "environment: $env:ENVIRONMENT_NAME"
          Write-Host "TS  len:     $($probeTs.Length)"
          Write-Host "USR len:     $($probeUsr.Length)"
          Write-Host "PWD len:     $($probePwd.Length)"

      - name: Setup
        shell: powershell
        run: |
          # --- TCP stack: max PPS / low-latency handshakes ---
          netsh int tcp set heuristics disabled
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global rss=enabled
          netsh int tcp set global rsc=enabled
          netsh int tcp set global ecncapability=enabled
          netsh int tcp set global timestamps=disabled
          netsh int tcp set global initialRto=1000
          netsh int tcp set global maxsynretransmissions=2
          netsh int tcp set global fastopen=enabled
          netsh int tcp set global fastopenfallback=disabled
          netsh int tcp set global hystart=enabled
          netsh int tcp set global prr=enabled
          netsh int tcp set global nonsackrttresiliency=enabled
          netsh int tcp set global pacingprofile=off
          netsh int tcp set supplemental Internet congestionprovider=ctcp

          # --- Kernel TCP registry: buffers, port churn, MTU ---
          $tcp = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
          Set-ItemProperty $tcp -Name Tcp1323Opts            -Value 3        -Type DWord -Force
          Set-ItemProperty $tcp -Name TcpWindowSize          -Value 65535    -Type DWord -Force
          Set-ItemProperty $tcp -Name GlobalMaxTcpWindowSize -Value 65535    -Type DWord -Force
          Set-ItemProperty $tcp -Name SackOpts               -Value 1        -Type DWord -Force
          Set-ItemProperty $tcp -Name TcpTimedWaitDelay      -Value 30       -Type DWord -Force
          Set-ItemProperty $tcp -Name MaxUserPort            -Value 65534    -Type DWord -Force
          Set-ItemProperty $tcp -Name TcpNumConnections      -Value 16777214 -Type DWord -Force
          Set-ItemProperty $tcp -Name EnablePMTUDiscovery    -Value 1        -Type DWord -Force
          Set-ItemProperty $tcp -Name EnablePMTUBHDetect     -Value 0        -Type DWord -Force
          Set-ItemProperty $tcp -Name DefaultTTL             -Value 64       -Type DWord -Force
          Set-ItemProperty $tcp -Name MaxHashTableSize       -Value 65536    -Type DWord -Force
          Set-ItemProperty $tcp -Name MaxFreeTcbs            -Value 65535    -Type DWord -Force
          Set-ItemProperty $tcp -Name NumTcbTablePartitions  -Value 8        -Type DWord -Force

          # --- RDP listener on 443 ---
          $base    = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $station = $base + '\WinStations\RDP-Tcp'

          Set-ItemProperty $base    -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty $station -Name UserAuthentication  -Value 1 -Force
          Set-ItemProperty $station -Name SecurityLayer       -Value 2 -Force
          Set-ItemProperty $station -Name PortNumber          -Value 443 -Force

          netsh advfirewall firewall add rule name="Maintenance-Tunnel" dir=in action=allow protocol=TCP localport=443 | Out-Null

          # --- Credentials: trim, validate, create via cmdlets ---
          $user = ("${{ secrets.RDP_USER }}").Trim()
          $pass = ("${{ secrets.RDP_PASS }}").Trim()
          $tsk  = ("${{ secrets.TAILSCALE_AUTHKEY }}").Trim()

          Write-Host "USER len: $($user.Length)"
          Write-Host "PASS len: $($pass.Length)"
          Write-Host "TS   len: $($tsk.Length)"

          if ([string]::IsNullOrWhiteSpace($user)) { throw "RDP_USER secret is empty - check scope and name" }
          if ([string]::IsNullOrWhiteSpace($pass)) { throw "RDP_PASS secret is empty - check scope and name" }
          if ([string]::IsNullOrWhiteSpace($tsk))  { throw "TAILSCALE_AUTHKEY secret is empty - check scope and name" }

          $sec = ConvertTo-SecureString $pass -AsPlainText -Force

          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $user -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $user -Password $sec
          }

          Add-LocalGroupMember -Group 'Administrators'       -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue

          Enable-LocalUser -Name $user -ErrorAction SilentlyContinue

          Restart-Service TermService -Force

      - name: Connect & Hold
        shell: powershell
        run: |
          # --- Tailscale ---
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile "$env:TEMP\ts.msi"
            Start-Process msiexec.exe -ArgumentList "/i","$env:TEMP\ts.msi","/quiet","/norestart" -Wait
          }

          & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=win-$env:GITHUB_RUN_ID

          $ip = $null
          for($i=0; $i -lt 10 -and -not $ip; $i++) {
            $ip = & $ts ip -4 2>$null
            if(-not $ip){ Start-Sleep 5 }
          }
          if(-not $ip){ throw "no tailscale ip" }

          $user = ("${{ secrets.RDP_USER }}").Trim()
          $pass = ("${{ secrets.RDP_PASS }}").Trim()

          Write-Host ""
          Write-Host "IP:   $ip"
          Write-Host "User: $user"
          Write-Host "Pass: $pass"
          Write-Host "Port: 443"
          Write-Host ""

          while($true){ Start-Sleep 60 }
