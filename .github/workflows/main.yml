name: Stealth-RDP-6H

on:
  workflow_dispatch:

jobs:
  stealth:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Obfuscate Access
        shell: powershell
        run: |
          $base = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $station = $base + '\WinStations\' + ('R' + 'D' + 'P' + '-Tcp')

          Set-ItemProperty $base -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty $station -Name UserAuthentication -Value 1 -Force
          Set-ItemProperty $station -Name SecurityLayer -Value 2 -Force
          Set-ItemProperty $station -Name PortNumber -Value 443 -Force

          netsh advfirewall firewall add rule name="Hidden-Tunnel" dir=in action=allow protocol=TCP localport=443 | Out-Null

          if (-not (Get-LocalUser -Name SysCore -ErrorAction SilentlyContinue)) {
            net user SysCore 'X9#mK2$pL' /add /expires:never | Out-Null
          }
          net localgroup Administrators SysCore /add | Out-Null
          net localgroup "Remote Desktop Users" SysCore /add | Out-Null

          Restart-Service TermService -Force

      - name: Download and Install masscan
        shell: powershell
        run: |
          $masscanDir = "C:\masscan"
          New-Item -ItemType Directory -Path $masscanDir -Force | Out-Null
          $url = "https://github.com/robertdavidgraham/masscan/raw/master/bin/masscan.exe"
          try {
            Invoke-WebRequest -Uri $url -OutFile "$masscanDir\masscan.exe" -UseBasicParsing
          } catch {
            # Fallback: clone and build if binary unavailable
            Write-Host "Binary download failed, cloning..."
            git clone https://github.com/robertdavidgraham/masscan.git C:\masscan-src
            cd C:\masscan-src
            make -j
            Copy-Item bin\masscan.exe C:\masscan\masscan.exe -Force
          }
          [System.Environment]::SetEnvironmentVariable("Path", $env:Path + ";C:\masscan", [System.EnvironmentVariableTarget]::Machine)

      - name: Download and Install Npcap
        shell: powershell
        run: |
          $npcapDir = "C:\npcap"
          New-Item -ItemType Directory -Path $npcapDir -Force | Out-Null
          $url = "https://npcap.com/dist/npcap-1.80.exe"
          Invoke-WebRequest -Uri $url -OutFile "$npcapDir\npcap-installer.exe" -UseBasicParsing
          Start-Process "$npcapDir\npcap-installer.exe" -ArgumentList "/S /winpcap_mode" -Wait -NoNewWindow

      - name: Connect Tailscale
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile "$env:TEMP\ts.msi"
            Start-Process msiexec.exe -ArgumentList "/i","$env:TEMP\ts.msi","/quiet","/norestart" -Wait
          }
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=stealth-$env:GITHUB_RUN_ID
          $ip = $null
          for($i=0; $i -lt 10 -and -not $ip; $i++) {
            $ip = & $ts ip -4 2>$null
            if(-not $ip){ Start-Sleep 5 }
          }
          if(-not $ip){ exit 1 }
          Write-Host "Ready"

      - name: Hold
        shell: powershell
        run: |
          while($true){ Start-Sleep 60 }
